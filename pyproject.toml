[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hfgcs"
version = "0.1.0"
description = "HFGCS (High Frequency Global Communications System) monitoring: scanning, USB demodulation and recording"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "soundfile>=0.12",
    "tomli>=2; python_version < '3.11'",
]

[project.optional-dependencies]
# OpenWebRX websocket client (hfgcs.sources.openwebrx, hfgcs_waterfall.py)
openwebrx = ["websockets>=12"]
# SoapySDR has no PyPI wheel: install python3-soapysdr from your distro and
# create the venv with --system-site-packages. kiwiclient is not on PyPI
# either: clone https://github.com/jks-prv/kiwiclient and point
# [kiwisdr] kiwirecorder (or $KIWIRECORDER) at kiwirecorder.py. It runs as a
# separate program and is never vendored (see THIRD_PARTY.md).
dev = ["pytest>=7", "ruff>=0.4", "websockets>=12"]
# Speech-to-text for decoding/asr.py (CTranslate2 Whisper + silero VAD).
# Also needs the ffmpeg binary on PATH (audio decode and preprocessing).
asr = ["faster-whisper>=1.1"]
# The decode service (python -m decoding.worker, hfgcs-decode.service): the ASR stack plus a
# static ffmpeg build (imageio-ffmpeg) used when the system has no ffmpeg binary, so no
# apt/sudo step is needed. Model weights are fetched once with
# `python -m decoding.worker --prefetch` (small.en, ~460 MB in ~/.cache/huggingface).
decode = ["faster-whisper>=1.1", "imageio-ffmpeg>=0.5"]

[project.scripts]
hfgcs-scanner = "hfgcs_scanner:main"
hfgcs-waterfall = "hfgcs_waterfall:main"

[tool.setuptools]
packages = ["hfgcs", "hfgcs.sources", "decoding"]
py-modules = ["hfgcs_scanner", "hfgcs_waterfall"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
