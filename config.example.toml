# Copy to config.toml and pass with --config. Every key is optional.
receiver_id = "airspyhf-local"
soapy_args = "driver=airspyhf"
hang_seconds = 4.0
preroll_seconds = 1.5
open_snr_db = 8.0
close_snr_db = 5.0
# Stale-floor recovery (s): after this long open, if even the quietest moment of the window is
# > close_snr_db above the floor, the floor is raised to it. 0 disables.
noise_floor_window_seconds = 30.0
# channels = [4724, 6739, 8992, 11175, 13200, 15016]
# Or pick named groups from hfgcs.config.FREQUENCY_GROUPS:
# channel_groups = ["voice"]            # default
# channel_groups = ["voice", "ale"]     # ALE needs a decoder; USB audio is recorded as-is

# Receiver backend: soapy (default) | openwebrx | kiwisdr | file
# See docs/sources.md, including the etiquette rules for shared receivers.
# source = "openwebrx"
#
# [openwebrx]
# url = "https://waterfall.scanplacer.com"
# allow_profile_switch = false   # never retune the shared radio unless the owner agrees
#
# [kiwisdr]
# enabled = false                # set to true by hand after reading docs/sources.md
# ident = ""                     # your callsign/name, shown to the sysop
# hosts = ["kiwisdr.example.org:8073"]
# channel_khz = 8992
#
# [file]
# path = "recording.wav"
